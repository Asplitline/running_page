name: CI

on: [push, pull_request]

jobs:
  python_lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        # 暂不含 3.14:pydantic-core/numpy/duckdb 等多个 C/Rust 扩展尚无 cp314
        # wheel,会源码编译失败;生态齐备后再加回。部署/同步实际用 3.12/3.13。
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: |
          # 走 uv.lock,依赖版本与同步流程一致,避免现装最新版行为漂移
          uv sync --frozen

      - name: Backend import smoke test
        run: |
          # 确认 backend 佳明同步链路可导入(独立闭环)
          uv run python -c "from backend.sync_garmin import sync, make_secret"
          uv run python -m backend.sync_garmin.sync --help

      - name: Check formatting (black)
        run: uv run black . --diff --color && uv run black . --check

      - name: Lint with Ruff
        run: uv run ruff check .

  node_lint_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run check and build
        run: |
          pnpm run check
          pnpm run lint
          pnpm run build
