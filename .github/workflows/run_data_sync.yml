name: Run Data Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '试运行:只验证同步能否跑通,跳过 commit/push(不污染仓库)'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - backend/**
      - pyproject.toml
      - uv.lock

env:
  # please change to your own config.
  ATHLETE: aiyuanzi
  TITLE: Aiyuanzi Running

  IGNORE_START_END_RANGE: 10 # Unit meter
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'
  IGNORE_RANGE: 10 # Unit meter
  SAVE_DATA_IN_GITHUB_CACHE: false # if you deploy in the vercel, check the README
  DATA_CACHE_PREFIX: 'track_data'
  TOKEN_CACHE_PREFIX: 'garmin_token'  # token 文件跨运行存活用
  BUILD_GH_PAGES: true # If you do not need GitHub Page please set it to `false`

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    outputs:
      SAVE_DATA_IN_GITHUB_CACHE: ${{ steps.set_output.outputs.SAVE_DATA_IN_GITHUB_CACHE }}
      DATA_CACHE_PREFIX: ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}
      BUILD_GH_PAGES: ${{ steps.set_output.outputs.BUILD_GH_PAGES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # 锁死依赖版本(走 uv.lock),避免 pip 装到新发的 curl_cffi 等
          # 导致 TLS 指纹变化触发佳明 CN 风控 401
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Cache Data Files
        if: env.SAVE_DATA_IN_GITHUB_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            assets
            GPX_OUT
            backend/data.db
            src/static/activities.json
            imported.json
          key: ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ env.DATA_CACHE_PREFIX }}-

      # ── token 持久化(核心)───────────────────────────────────────────────
      # 佳明 refresh token 每次刷新都会轮换(旧串可能被作废),寿命最长约 30 天。
      # 走 loads(串) 时轮换值只在内存、进程退出即丢,Secret 里永远是初始串 →
      # 30 天后必挂。改用文件模式 + Actions Cache 让轮换值跨运行存活。
      - name: Restore Garmin token cache
        id: token_cache
        uses: actions/cache/restore@v4
        with:
          path: .garmin_token
          # key 带 run_id 保证每次都是新 key(GitHub 不覆盖已存在的 key),
          # 靠 restore-keys 前缀回退到最近一份。
          key: ${{ env.TOKEN_CACHE_PREFIX }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.TOKEN_CACHE_PREFIX }}-

      # 写出 token 文件。两种情况会用 Secret 覆盖缓存里的文件:
      #   1. 缓存无文件(首次运行 / cache 被回收,7 天不访问即回收)
      #   2. Secret 内容变了 —— 说明人工重新生成过 token,缓存里那份已作废
      #
      # 情况 2 是必须的:失败运行也会 if:always() 存缓存,坏 token 会一直被
      # 恢复;若只在"无文件"时才写 Secret,更新 Secret 将永远不生效,报错与
      # 上次逐字节相同,极易误判成"重新生成也失败了"。
      # 比对只用 SHA-256 指纹,不把 token 原文写进缓存。
      - name: Bootstrap token file from secret
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
        run: |
          set -euo pipefail
          mkdir -p .garmin_token
          token_file=.garmin_token/garmin_tokens.json
          fp_file=.garmin_token/.secret_fingerprint

          if [[ -n "${GARMIN_SECRET_STRING_CN:-}" ]]; then
            secret_fp=$(printf '%s' "$GARMIN_SECRET_STRING_CN" | sha256sum | cut -d' ' -f1)
          else
            secret_fp=""
          fi

          if [[ -s "$token_file" ]]; then
            # 有缓存文件:Secret 指纹一致则沿用(它可能已轮换,比 Secret 更新)
            cached_fp=$(cat "$fp_file" 2>/dev/null || echo "")
            if [[ -z "$secret_fp" || "$secret_fp" == "$cached_fp" ]]; then
              echo "token 文件已从缓存恢复,跳过 bootstrap"
              exit 0
            fi
            if [[ -z "$cached_fp" ]]; then
              # 指纹机制上线前存的旧缓存。无从判断它与当前 Secret 是否同源,
              # 保守起见按 Secret 为准重置一次,之后就有指纹可比了。
              echo "::notice::缓存 token 无指纹记录(指纹机制上线前的旧缓存),按 Secret 重置一次"
            else
              echo "::notice::检测到 GARMIN_SECRET_STRING_CN 已更新,用新 Secret 覆盖缓存 token"
            fi
          fi

          if [[ -z "$secret_fp" ]]; then
            echo "::error::缓存无 token 文件,且 GARMIN_SECRET_STRING_CN 未配置,无法认证"
            exit 1
          fi

          printf '%s' "$GARMIN_SECRET_STRING_CN" > "$token_file"
          chmod 600 "$token_file"
          # 指纹随 token 文件一起进缓存,供下次运行比对
          printf '%s' "$secret_fp" > "$fp_file"
          # Secret 换新后旧轮换史失去意义,清掉避免"已使用 N 天"读数误导
          rm -f .garmin_token/garmin_token_audit.json
          echo "已用 Secret bootstrap 出 token 文件"

      # token 文件体检:只暴露体征(长度/exp/能否解析 JSON),绝不打印 token 内容。
      # 体检对象是实际参与认证的文件,而非 Secret —— 文件可能来自缓存(已轮换过)。
      - name: Inspect Garmin token file
        run: |
          uv run python - <<'PY'
          import base64
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          CN_TZ = timezone(timedelta(hours=8))
          TOKEN_PATH = Path(".garmin_token/garmin_tokens.json")

          def decode_exp(tok):
              # 解 JWT payload 段的 exp(过期时间戳),不做签名校验
              payload = tok.split(".")[1]
              payload += "=" * (-len(payload) % 4)
              return json.loads(base64.urlsafe_b64decode(payload)).get("exp")

          def report_access_token(tok):
              # access token 约 4 小时寿命,过期是常态:文件模式下库会自动刷新并回写。
              if not tok:
                  print("[token] access(di_token): 缺失 —— 文件不完整")
                  return
              try:
                  exp = decode_exp(tok)
              except Exception:
                  print("[token] access(di_token): 非 JWT 格式(不影响,运行时会刷新)")
                  return
              if exp is None:
                  print("[token] access(di_token): 无 exp 字段(不影响,运行时会刷新)")
                  return
              exp_dt = datetime.fromtimestamp(exp, tz=CN_TZ)
              left = exp_dt - datetime.now(tz=CN_TZ)
              if left.total_seconds() <= 0:
                  print(
                      f"[token] access(di_token): 已过期(北京时间 {exp_dt:%Y-%m-%d %H:%M})"
                      " —— 属正常,约 4 小时寿命,运行时会用 refresh token 换新"
                  )
              else:
                  print(
                      f"[token] access(di_token): 北京时间 {exp_dt:%Y-%m-%d %H:%M} 过期"
                      f"(还剩 {left.seconds // 3600} 小时)"
                  )

          def report_refresh_token(tok):
              # refresh token 是不透明串(非 JWT),约 30 天寿命,解不出有效期。
              # 剩余寿命由 token_audit 模块按轮换史推算,见同步日志的「token 观测」。
              if not tok:
                  print("[token] refresh(di_refresh_token): 缺失 —— 无法刷新,同步必失败")
                  return
              print(
                  f"[token] refresh(di_refresh_token): 已提供(长度={len(tok)})"
                  " —— 社区称约 30 天寿命,但实测有 13 天即失效的情况;"
                  "若同步报 401 先本地重放同一份 token 判定,再决定是否重跑 make_secret"
              )

          if not TOKEN_PATH.exists():
              print(f"[token] 文件不存在: {TOKEN_PATH}")
              raise SystemExit(0)

          raw = TOKEN_PATH.read_text()
          print(f"[token] 文件长度={len(raw)} 权限={oct(TOKEN_PATH.stat().st_mode)[-3:]}")
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"[token] JSON 解析失败: {e}(错在第 {e.pos} 个字符)")
              raise SystemExit(0) from None
          if not isinstance(data, dict):
              print(f"[token] 解析出 {type(data).__name__} 而非对象 —— 值可能被多套了一层引号")
              raise SystemExit(0)

          print(f"[token] JSON 合法,keys={sorted(data.keys())}")
          missing = {"di_token", "di_refresh_token", "di_client_id"} - set(data)
          if missing:
              print(f"[token] 缺少必需 key: {sorted(missing)}")
          report_access_token(data.get("di_token"))
          report_refresh_token(data.get("di_refresh_token"))
          PY

      # Garmin 中国区同步。首次 token 生成: python -m backend.sync_garmin.make_secret <email> <password> --is-cn
      # 走 --tokenstore 文件模式:库会在 token 快过期时自动刷新并回写文件,
      # 轮换出的新 refresh token 由后续 cache 步骤带到下次运行。
      - name: Run sync Garmin CN script
        env:
          # 账密可选:token 文件损坏/被 API 拒时作为降级通道。
          # 注意 CI 里账密登录可能触发 MFA 而卡死,所以它是应急而非常规路径。
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          # 跳过 Nominatim 反向地理编码:CN 活动逐条查会被 OSM 限流/掐连接而卡死,
          # 且 runner 共享 IP 常被封。地名对可视化非必需,轨迹靠 GPX 渲染。
          SKIP_REVERSE_GEOCODE: 'true'
        run: |
          uv run python -m backend.sync_garmin.sync \
            --tokenstore .garmin_token/garmin_tokens.json --is-cn --only-run

      # 无条件回存:即使同步失败,刷新出的新 token 也必须留下 ——
      # 否则下次运行还是拿旧串,同一个错误会一直重复。
      - name: Save Garmin token cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .garmin_token
          key: ${{ env.TOKEN_CACHE_PREFIX }}-${{ github.run_id }}

      - name: Push new runs
        if: env.SAVE_DATA_IN_GITHUB_CACHE != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          # 显式白名单而非 git add . —— token 文件绝不能进仓库。
          # .gitignore 已排除 .garmin_token/,这里是第二层保险。
          # 逐个 add:daily_metrics.json 等产物可能不存在,不能让整条 add 失败。
          for path in GPX_OUT backend/data.db imported.json \
                      frontend/src/static/activities.json \
                      frontend/src/static/daily_metrics.json \
                      src/static/activities.json; do
            if [[ -e "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          # 提交前核验:暂存区不得含任何 token 文件
          if git diff --cached --name-only | grep -qE 'garmin_token|\.garmin_token'; then
            echo "::error::暂存区检出 token 文件,拒绝提交"
            exit 1
          fi
          git commit -m 'update new runs'
          git push

      - name: Set Output
        id: set_output
        env:
          SAVE_DATA_IN_GITHUB_CACHE: ${{ env.SAVE_DATA_IN_GITHUB_CACHE }}
          DATA_CACHE_PREFIX: ${{ env.DATA_CACHE_PREFIX }}
          BUILD_GH_PAGES: ${{ env.BUILD_GH_PAGES }}
        run: |
          echo "SAVE_DATA_IN_GITHUB_CACHE=$SAVE_DATA_IN_GITHUB_CACHE" >> "$GITHUB_OUTPUT"
          echo "DATA_CACHE_PREFIX=$DATA_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "BUILD_GH_PAGES=$BUILD_GH_PAGES" >> "$GITHUB_OUTPUT"

  publish_github_pages:
    if: needs.sync.result == 'success' && needs.sync.outputs.BUILD_GH_PAGES == 'true'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: ${{needs.sync.outputs.SAVE_DATA_IN_GITHUB_CACHE == 'true'}}
      data_cache_prefix: ${{needs.sync.outputs.DATA_CACHE_PREFIX}}
    needs:
      - sync
