name: Run Data Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '试运行:只验证同步能否跑通,跳过 commit/push(不污染仓库)'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
    paths:
      - backend/**
      - pyproject.toml
      - uv.lock

env:
  # please change to your own config.
  ATHLETE: aiyuanzi
  TITLE: Aiyuanzi Running

  IGNORE_START_END_RANGE: 10 # Unit meter
  IGNORE_POLYLINE: 'ktjrFoemeU~IorGq}DeB'
  IGNORE_RANGE: 10 # Unit meter
  SAVE_DATA_IN_GITHUB_CACHE: false # if you deploy in the vercel, check the README
  DATA_CACHE_PREFIX: 'track_data'
  BUILD_GH_PAGES: true # If you do not need GitHub Page please set it to `false`

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    outputs:
      SAVE_DATA_IN_GITHUB_CACHE: ${{ steps.set_output.outputs.SAVE_DATA_IN_GITHUB_CACHE }}
      DATA_CACHE_PREFIX: ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}
      BUILD_GH_PAGES: ${{ steps.set_output.outputs.BUILD_GH_PAGES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          # 锁死依赖版本(走 uv.lock),避免 pip 装到新发的 curl_cffi 等
          # 导致 TLS 指纹变化触发佳明 CN 风控 401
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Cache Data Files
        if: env.SAVE_DATA_IN_GITHUB_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            assets
            GPX_OUT
            backend/data.db
            src/static/activities.json
            imported.json
          key: ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ env.DATA_CACHE_PREFIX }}-

      # Secret 体检:只暴露体征(长度/首尾字符/能否解析 JSON),绝不打印 token 内容
      - name: Inspect Garmin CN secret
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
        run: |
          uv run python - <<'PY'
          import base64
          import json
          import os
          from datetime import datetime, timedelta, timezone

          CN_TZ = timezone(timedelta(hours=8))  # 北京时间

          def decode_exp(tok):
              # 解 JWT payload 段的 exp(过期时间戳),不做签名校验
              payload = tok.split(".")[1]
              payload += "=" * (-len(payload) % 4)  # 补 base64 padding
              return json.loads(base64.urlsafe_b64decode(payload)).get("exp")

          def report_access_token(tok):
              # access token 过期是常态、不是故障:CI 走 loads(串) 加载,
              # 库内 _refresh_session 只在从「文件」加载时才回写 tokenstore,
              # 所以刷新后的新值留在内存、进程退出即丢,Secret 里永远是旧串。
              # 真正决定同步成败的是下面的 refresh token。
              if not tok:
                  print("[token] access(di_token): 缺失 —— Secret 不完整,需重跑 make_secret")
                  return
              try:
                  exp = decode_exp(tok)
              except Exception:
                  print("[token] access(di_token): 非 JWT 格式(不影响,运行时会自动刷新)")
                  return
              if exp is None:
                  print("[token] access(di_token): 无 exp 字段(不影响,运行时会自动刷新)")
                  return
              exp_dt = datetime.fromtimestamp(exp, tz=CN_TZ)
              left = exp_dt - datetime.now(tz=CN_TZ)
              if left.total_seconds() <= 0:
                  print(
                      f"[token] access(di_token): 已过期(北京时间 {exp_dt:%Y-%m-%d %H:%M})"
                      " —— 属正常,运行时会用 refresh token 自动换新"
                  )
              else:
                  print(
                      f"[token] access(di_token): 北京时间 {exp_dt:%Y-%m-%d %H:%M} 过期"
                      f"(还剩 {left.days} 天 {left.seconds // 3600} 小时)"
                  )

          def report_refresh_token(tok):
              # refresh token 是不透明串(非 JWT),解不出有效期,只能校验存在性。
              # 它一旦失效,_refresh_di_token 会抛 401,此时才需要重跑 make_secret。
              if not tok:
                  print(
                      "[token] refresh(di_refresh_token): 缺失 —— 无法自动刷新,"
                      "同步必失败,需重跑 make_secret"
                  )
                  return
              print(
                  f"[token] refresh(di_refresh_token): 已提供(长度={len(tok)},不透明串无有效期)"
                  " —— 这是同步成败的关键;若下方同步报 401,说明它已失效,需重跑 make_secret"
              )

          s = os.environ.get("GARMIN_SECRET_STRING_CN")
          if s is None:
              print("[secret] 未设置(env 里没有该变量)")
              raise SystemExit(0)

          print(f"[secret] 长度={len(s)}")
          if s == "":
              print("[secret] 为空字符串 —— GitHub Secret 未配置或值为空")
              raise SystemExit(0)

          stripped = s.strip()
          if stripped != s:
              print(f"[secret] 首尾有空白!strip 后长度={len(stripped)}(粘贴时可能带了空格/换行)")
          print(f"[secret] 首字符={s[0]!r} 尾字符={s[-1]!r}")
          if s[0] != "{" or s[-1] != "}":
              print("[secret] 首尾不是 {} —— 不是合法 JSON 对象串,极可能是旧值/错误粘贴")

          try:
              data = json.loads(s)
          except json.JSONDecodeError as e:
              print(f"[secret] JSON 解析失败: {e}(错在第 {e.pos} 个字符)")
          else:
              if not isinstance(data, dict):
                  print(f"[secret] 解析出的是 {type(data).__name__} 而非对象 —— 值可能被多套了一层引号")
              else:
                  print(f"[secret] JSON 合法,keys={sorted(data.keys())}")
                  want = {"di_token", "di_refresh_token", "di_client_id"}
                  missing = want - set(data.keys())
                  if missing:
                      print(f"[secret] 缺少 make_secret 应有的 key: {sorted(missing)}")
                  report_access_token(data.get("di_token"))
                  report_refresh_token(data.get("di_refresh_token"))
          PY

      # Garmin 中国区同步。生成 secret: python -m backend.sync_garmin.make_secret <email> <password> --is-cn
      # secret 是 JSON 串,必须走 env 注入并加引号,否则会被 shell 按空格/花括号拆断
      - name: Run sync Garmin CN script
        env:
          GARMIN_SECRET_STRING_CN: ${{ secrets.GARMIN_SECRET_STRING_CN }}
          # 跳过 Nominatim 反向地理编码:CN 活动逐条查会被 OSM 限流/掐连接而卡死,
          # 且 runner 共享 IP 常被封。地名对可视化非必需,轨迹靠 GPX 渲染。
          SKIP_REVERSE_GEOCODE: 'true'
        run: |
          uv run python -m backend.sync_garmin.sync "$GARMIN_SECRET_STRING_CN" --is-cn

      - name: Push new runs
        if: env.SAVE_DATA_IN_GITHUB_CACHE != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          git commit -m 'update new runs' || echo 'nothing to commit'
          git push || echo 'nothing to push'

      - name: Set Output
        id: set_output
        env:
          SAVE_DATA_IN_GITHUB_CACHE: ${{ env.SAVE_DATA_IN_GITHUB_CACHE }}
          DATA_CACHE_PREFIX: ${{ env.DATA_CACHE_PREFIX }}
          BUILD_GH_PAGES: ${{ env.BUILD_GH_PAGES }}
        run: |
          echo "SAVE_DATA_IN_GITHUB_CACHE=$SAVE_DATA_IN_GITHUB_CACHE" >> "$GITHUB_OUTPUT"
          echo "DATA_CACHE_PREFIX=$DATA_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "BUILD_GH_PAGES=$BUILD_GH_PAGES" >> "$GITHUB_OUTPUT"

  publish_github_pages:
    if: needs.sync.result == 'success' && needs.sync.outputs.BUILD_GH_PAGES == 'true'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: ${{needs.sync.outputs.SAVE_DATA_IN_GITHUB_CACHE == 'true'}}
      data_cache_prefix: ${{needs.sync.outputs.DATA_CACHE_PREFIX}}
    needs:
      - sync
