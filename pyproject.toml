[project]
name = "running_page"
version = "2.5.1"
description = "Default template for PDM package"
authors = [{ name = "yihong0618", email = "zouzou0208@gmail.com" }]
dependencies = [
  "httpx",
  "gpxpy==1.6.2",
  "stravalib==0.10.4",
  "appdirs>=1.4.0",
  "svgwrite>=1.1.9",
  "colour>=0.1.5",
  "s2sphere",
  "arrow",
  "geopy",
  "polyline",
  "sqlalchemy",
  "tzfpy; platform_system != \"Windows\"",
  "timezonefinder; platform_system == \"Windows\"",
  "pyyaml",
  "aiofiles",
  "cloudscraper",
  "tcxreader",
  "rich",
  "lxml>=6.0.1", # 6.0.0 无 cp314 Linux wheel,3.14 会源码编译失败;6.0.1+ 才有

  "eviltransform",
  "stravaweblib",
  "tenacity",
  "numpy",
  "tzlocal",
  "fit-tool",
  "garmin-fit-sdk",
  "haversine==2.8.0",
  "garth",
  "pycryptodome",
  "duckdb",
  "openai",
  "svglib>=1.5.1",
  "cairosvg>=2.7.1",
  "certifi==2025.1.31",
  "garminconnect>=0.3.7,<0.4",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
# CI 用的 lint/format 工具,纳入 uv.lock 统一锁版本,避免现装最新版行为漂移
dev = ["black", "ruff", "pytest"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.ruff.lint]
# 忽略风格洁癖类规则(无一真 bug): 宽异常捕获是有意的容错设计,
# ={} 默认参数不 mutate, naive datetime 是项目既有的本地时间约定。
ignore = [
    "BLE001", # 允许 except Exception(异常记录/容错)
    "B006",   # 允许可变默认参数(不 mutate)
    "DTZ007", # 允许 naive strptime(本地时间约定)
    "S110",   # 允许 try-except-pass(反查容错)
    "SIM401", # 允许 if/else 取值(可读性偏好)
    "RUF046", # int() 包装
    "TRY002", # 允许 raise Exception
    "PLW1508", # getenv 默认值类型
    "C408",   # 允许 dict() 调用
    "FURB162", # 时区替换写法
]

[tool.pytest.ini_options]
testpaths = ["tests"]
